experiment_name: "amazon_books_gradnorm_only"
experiment_group: "amazon_books_extended"

data:
  dataset: "amazon_books"
  data_dir: "/root/autodl-tmp/extended_fusion/datasets/amazon_books"

model:
  type: "attention_fusion"
  hidden_sizes: [32, 16]
  n_users: 12129
  n_items: 14710
  embedding_dim: 64
  text_dim: 384
  attention:
    hidden_sizes: [32]
    activation: "relu"
    dropout: 0.1

regularization:
  lambda_alpha: 0.0
  lambda_beta: 0.0

grad_balance:
  method: "independent"
  log_grads: true
  eps: 1e-8
  target_ratio: 1.0
  max_scale: 5.0

training:
  batch_size: 1024
  learning_rate: 0.003
  num_epochs: 50
  early_stopping_patience: 10
  optimizer: "adam"
  weight_decay: 1e-5
  loss_type: "bpr"
  negative_sampling: 4

evaluation:
  metrics: ["recall", "ndcg", "hit", "mrr"]
  k_list: [10]
  eval_batch_size: 512
  eval_frequency: 1

text_encoder:
  use_precomputed: true
  encoder_alias: "minilm"
  encoder_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_file: "/root/autodl-tmp/extended_fusion/embeddings/amazon_books/all-MiniLM-L6-v2.pkl"

logging:
  log_frequency: 100
  save_model: false

device: "auto"
