experiment_name: "mind_lightgcn_only"
experiment_group: "mind_extended"

data:
  dataset: "mind"
  data_dir: "/root/autodl-tmp/extended_fusion/datasets/mind"

model:
  type: "fixed_fusion"
  n_users: 50000
  n_items: 7713
  embedding_dim: 64
  text_dim: 384
  lambda_fixed: 0.0

training:
  batch_size: 1024
  learning_rate: 0.003
  num_epochs: 60
  early_stopping_patience: 10
  optimizer: "adam"
  weight_decay: 1e-5
  loss_type: "bpr"
  negative_sampling: 4

evaluation:
  metrics: ["recall", "ndcg", "hit", "mrr"]
  k_list: [10]
  eval_batch_size: 256
  eval_frequency: 1

text_encoder:
  use_precomputed: true
  encoder_alias: "minilm"
  encoder_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_file: "/root/autodl-tmp/extended_fusion/embeddings/mind/all-MiniLM-L6-v2.pkl"

grad_balance:
  method: "none"
  log_grads: true

logging:
  log_frequency: 200
  save_model: true
  checkpoint_dir: "/root/autodl-tmp/extended_fusion/checkpoints"

device: "auto"
